{% extends "!layout.html" %}
{% block extrahead %}
  {{ super() }}
  <script>
    // Force light theme regardless of system preference
    try {
      localStorage.setItem("mode", "light");
      localStorage.setItem("theme", "light");
      document.documentElement.dataset.mode = "light";
      document.documentElement.dataset.theme = "light";
    } catch (e) {}
  </script>
{% endblock %}
