syntax = "proto3";

package dao_card_manager;

service DaoCardService {
	rpc Init(CardConfig) returns (CardResponse) {}
	rpc Fini(Emp) returns (Emp){}
	rpc Info(Emp) returns (CardInfo) {}
	rpc AppUpdate(UpdateReq) returns (CardResponse) {}
	rpc Stats(Emp) returns (CardStats) {}
	rpc FwUpdate(UpdateReq) returns (CardResponse) {}
	rpc AppFallback(Emp) returns (CardResponse) {}
}

message CardConfig {
	uint32 argc = 1;
	repeated string argv = 2;
	uint32 crypto_nb_desc = 3;
}

message CardInfo {
	string version = 1;
	uint32 nb_devs = 2;
	uint32 max_sessions = 3;
}

message CardResponse {
	int32 err = 1;
}

message UpdateReq {
	string file_name = 1;
	bytes file_content = 2;
	bool is_last_chunk = 3;
}

message CardStats {
	repeated uint64 rx_packets = 1;
	repeated uint64 tx_packets = 2;
}

message Emp {
}
