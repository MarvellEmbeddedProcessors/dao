name: build-cn10k-pcie-ep

on:
  push:
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  ubuntu-cn10k-build:
    name: ubuntu-cn10k-arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2
      - name: Generate cache keys
        id: get_ref_keys
        run: |
          echo 'ccache=ccache-'$(date -u +%Y-%m) >> $GITHUB_OUTPUT
      - name: Retrieve ccache cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.ccache
          key: ${{ steps.get_ref_keys.outputs.ccache }}-${{ github.ref }}
          restore-keys: |
            ${{ steps.get_ref_keys.outputs.ccache }}-refs/heads/main
      - name: Extract version details
        id: version
        run: |
          mkdir -p "${PWD}/artifacts"
          git tag --points-at HEAD > /tmp/tags
          [ -s /tmp/tags ] && PKG_POSTFIX= || PKG_POSTFIX=-devel
          echo "PKG_POSTFIX=${PKG_POSTFIX}" >> "${PWD}/artifacts/env"
          echo "PKG_VERSION_NAME=`cat VERSION`" >> "${PWD}/artifacts/env"

      - name: Build OCTEON-EP and generate package
        id: build
        run: |
            set -x
            BASE_DIR=${PWD}
            sudo apt-get update -q -y
            sudo apt-get install -y build-essential gcc meson ccache git doxygen apt-utils dialog
            sudo apt-get install -y ccache git software-properties-common wget libconfig-dev
            source ${BASE_DIR}/artifacts/env
            git config --global --add safe.directory "${PWD}"
            DISTRO=ubuntu-`lsb_release -rs`
            echo "DISTRO=${DISTRO}" >> ${BASE_DIR}/artifacts/env
            git clone "https://github.com/MarvellEmbeddedProcessors/pcie_ep_octeon_target.git"
            cd "${PWD}/pcie_ep_octeon_target"
            export CC='ccache gcc'
            export AR='ar'
            export LD='ld'
            export CFLAGS="-DUSE_PEM_AND_DPI_PF=1"
            export INSTALL_BASE="${PWD}/install/usr"
            export INSTALL_PATH="${INSTALL_BASE}"
            cd target/libs/octep_cp_lib
            ccache -p
            make install
            cd -
            export INSTALL_PATH="${INSTALL_BASE}/bin"
            cd target/apps/octep_cp_agent/
            CFLAGS="-I${INSTALL_BASE}/include" LDFLAGS="-L${INSTALL_BASE}/lib" make install
            cp cn103-102.cfg $INSTALL_PATH/.
            cp cn106xx.cfg $INSTALL_PATH/.
            cd -
            mkdir -p "${PWD}/install/debian"
            mkdir -p "${PWD}/install/DEBIAN"
            cd "${PWD}/install"
            echo 'Source: OCTEON-EP' > debian/control
            echo 'Package: oct-ep-target-cn10k'$PKG_POSTFIX >> DEBIAN/control
            echo 'Version: '$PKG_VERSION_NAME >> DEBIAN/control
            echo "Depends: `dpkg-shlibdeps -O usr/bin/octep_cp_agent | awk -F'Depends=' '{print $2}'`" >> DEBIAN/control
            echo "Maintainer: Jerin Jacob (jerinj@marvell.com)" >> DEBIAN/control
            echo "Architecture: arm64" >> DEBIAN/control
            echo "Description: Octeon-ep agent for Marvell Octeon 10" >> DEBIAN/control
            rm -rf debian
            cd -
            rm -rf "${PWD}/install/~" "${PWD}/install/home"
            mv "${PWD}/install" "${PWD}/oct-ep-target-cn10k${PKG_POSTFIX}_${PKG_VERSION_NAME}_arm64"
            dpkg --build "${PWD}/oct-ep-target-cn10k${PKG_POSTFIX}_${PKG_VERSION_NAME}_arm64"
            cp "${PWD}/oct-ep-target-cn10k${PKG_POSTFIX}_${PKG_VERSION_NAME}_arm64.deb" ${BASE_DIR}/artifacts/.

      - name: Export version name
        id: artifacts
        run: |
          source "${PWD}/artifacts/env"
          echo $PKG_VERSION_NAME
          echo "PKG_VERSION_NAME=${PKG_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo $PKG_POSTFIX
          echo "PKG_POSTFIX=${PKG_POSTFIX}" >> "$GITHUB_OUTPUT"
          echo $DISTRO
          echo "DISTRO=${DISTRO}" >> "$GITHUB_OUTPUT"
          [[ "$PKG_POSTFIX" == "-devel" ]] && TAG=devel || TAG=${PKG_VERSION_NAME}
          [[ "$PKG_POSTFIX" == "-devel" ]] && IS_DEVEL="true" || IS_DEVEL="false"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IS_DEVEL=${IS_DEVEL}" >> "$GITHUB_OUTPUT"
          echo $TAG
          echo $IS_DEVEL
      - name: Delete existing release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete oct-ep-target-cn10k-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}-${{ steps.artifacts.outputs.DISTRO }}-${{ steps.artifacts.outputs.TAG }} --cleanup-tag -y
        continue-on-error: true
      - name: Release octeon ep cn10k package
        uses: softprops/action-gh-release@v2.0.4
        if: ${{ github.event_name == 'push' }}
        with:
          tag_name: oct-ep-target-cn10k-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}-${{ steps.artifacts.outputs.DISTRO }}-${{ steps.artifacts.outputs.TAG }}
          files: |
            ${{ github.workspace }}/artifacts/oct-ep-target-cn10k${{ steps.artifacts.outputs.PKG_POSTFIX }}_${{ steps.artifacts.outputs.PKG_VERSION_NAME }}_arm64.deb
      - name: Dispatch package update event
        if: ${{ github.event_name == 'push' }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PPA_REPO_SECRET }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/marvellembeddedprocessors/packages/dispatches \
            -d '{"event_type":"dispatch-event", "client_payload": {"package" : "octeon-ep",
            "tag": "oct-ep-target-cn10k-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}-${{ steps.artifacts.outputs.DISTRO }}-${{ steps.artifacts.outputs.TAG }}",
            "has_dpdk" : "false", "distro" : "${{ steps.artifacts.outputs.DISTRO }}",
            "platform" : "cn10k",
            "devel": "${{ steps.artifacts.outputs.IS_DEVEL }}"}}'
